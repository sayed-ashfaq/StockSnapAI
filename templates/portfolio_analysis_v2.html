<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Sentiment Analysis - TradePro AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 0;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #00ff96 0%, #00d4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00ff96 0%, #00d4ff 100%);
            color: #000000;
        }

        .main-content {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 24px;
            margin-top: 24px;
        }

        .left-panel, .right-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px;
        }

        .panel-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #00ff96 0%, #00d4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-section {
            margin-bottom: 24px;
        }

        .input-label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #c0c0c0;
        }

        .stock-input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .stock-input:focus {
            outline: none;
            border-color: #00ff96;
        }

        .add-stock-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00ff96 0%, #00d4ff 100%);
            color: #000000;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .add-stock-btn:hover {
            transform: translateY(-2px);
        }

        .portfolio-list {
            margin-bottom: 24px;
        }

        .portfolio-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .stock-symbol {
            font-weight: 600;
            color: #00ff96;
        }

        .remove-btn {
            padding: 4px 12px;
            background: rgba(255, 0, 0, 0.2);
            color: #ff6b6b;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .analyze-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .analyze-btn:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: #666666;
            cursor: not-allowed;
        }

        .analyze-btn:not(:disabled):hover {
            transform: translateY(-2px);
        }

        .empty-state, .loading, .error-state {
            text-align: center;
            padding: 60px 20px;
            color: #c0c0c0;
        }

        .loading h3 {
            color: #00ff96;
            margin-bottom: 16px;
        }

        .error-state {
            background: rgba(255, 0, 0, 0.1);
            border-radius: 8px;
            color: #ff6b6b;
        }

        .analysis-section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #00ff96;
        }

        .portfolio-summary {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .summary-item {
            text-align: center;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        .summary-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 4px;
        }

        .summary-value {
            font-size: 18px;
            font-weight: 600;
        }

        .summary-value.positive { color: #00ff96; }
        .summary-value.negative { color: #ff6b6b; }
        .summary-value.neutral { color: #ffd700; }

        .themes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }

        .theme-card {
            padding: 16px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
        }

        .theme-title {
            font-weight: 600;
            margin-bottom: 12px;
        }

        .theme-list {
            list-style: none;
        }

        .theme-list li {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
            color: #c0c0c0;
        }

        .stock-analysis {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .stock-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .stock-ticker {
            font-size: 18px;
            font-weight: 600;
            color: #00ff96;
        }

        .stock-metrics {
            display: flex;
            gap: 20px;
        }

        .metric {
            text-align: center;
        }

        .metric-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 4px;
        }

        .metric-value {
            font-size: 14px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .metric-value.positive { background: rgba(0, 255, 150, 0.2); color: #00ff96; }
        .metric-value.negative { background: rgba(255, 107, 107, 0.2); color: #ff6b6b; }
        .metric-value.neutral { background: rgba(255, 215, 0, 0.2); color: #ffd700; }
        .metric-value.bullish { background: rgba(0, 255, 150, 0.2); color: #00ff96; }
        .metric-value.bearish { background: rgba(255, 107, 107, 0.2); color: #ff6b6b; }

        .stock-summary {
            color: #c0c0c0;
            font-size: 14px;
            line-height: 1.5;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-section {
            background: rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 8px;
        }

        .stat-title {
            font-weight: 600;
            margin-bottom: 12px;
            color: #00ff96;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="nav">
                <a href="/" class="logo">TradePro AI</a>
                <div class="nav-buttons">
                    <a href="/" class="btn btn-secondary">🏠 Dashboard</a>
                    <a href="/document-analysis" class="btn btn-primary">📄 Document Analysis</a>
                </div>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="main-content">
            <!-- Left Panel - Portfolio Input -->
            <div class="left-panel">
                <div class="panel-header">Stock News & Sentiment Analysis</div>
                <p style="color: #b0b0b0; margin-bottom: 24px; font-size: 14px;">
                    Enter stock symbols to get real-time news analysis with AI-powered sentiment scoring
                </p>

                <div class="input-section">
                    <label class="input-label">Your Stock Portfolio</label>
                    <input type="text" id="stockInput" class="stock-input"
                           placeholder="Enter Stock Symbol (e.g., AAPL, TSLA, NVDA/NYSE)"
                           maxlength="10">
                    <button class="add-stock-btn" onclick="addStock()">+ Add Stock</button>
                </div>

                <div class="portfolio-list">
                    <label class="input-label">Current Portfolio:</label>
                    <div id="portfolioList">
                        <!-- Portfolio items will be added here -->
                    </div>
                </div>

                <button class="analyze-btn" id="analyzeBtn" onclick="analyzePortfolio()" disabled>
                    🚀 Analyze Portfolio
                </button>
            </div>

            <!-- Right Panel - Analysis Results -->
            <div class="right-panel" id="resultsPanel">
                <div class="empty-state">
                    <h3>Ready for Analysis</h3>
                    <p>Add stocks to your portfolio and click "Analyze Portfolio" to get AI-powered sentiment analysis and market insights.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let portfolio = [];
        const API_BASE= "";

        function addStock() {
            const input = document.getElementById('stockInput');
            const symbol = input.value.trim().toUpperCase();

            if (symbol && !portfolio.includes(symbol)) {
                portfolio.push(symbol);
                updatePortfolioDisplay();
                input.value = '';
            }

            updateAnalyzeButton();
        }

        function removeStock(symbol) {
            portfolio = portfolio.filter(stock => stock !== symbol);
            updatePortfolioDisplay();
            updateAnalyzeButton();

            if (portfolio.length === 0) {
                showEmptyState();
            }
        }

        function updatePortfolioDisplay() {
            const portfolioList = document.getElementById('portfolioList');

            if (portfolio.length === 0) {
                portfolioList.innerHTML = '<p style="color: #666; font-style: italic;">No stocks added yet</p>';
                return;
            }

            portfolioList.innerHTML = portfolio.map(symbol => `
                <div class="portfolio-item">
                    <span class="stock-symbol">${symbol}</span>
                    <button class="remove-btn" onclick="removeStock('${symbol}')">Remove</button>
                </div>
            `).join('');
        }

        function updateAnalyzeButton() {
            const analyzeBtn = document.getElementById('analyzeBtn');
            analyzeBtn.disabled = portfolio.length === 0;
        }

        function showEmptyState() {
            const resultsPanel = document.getElementById('resultsPanel');
            resultsPanel.innerHTML = `
                <div class="empty-state">
                    <h3>Ready for Analysis</h3>
                    <p>Add stocks to your portfolio and click "Analyze Portfolio" to get AI-powered sentiment analysis and market insights.</p>
                </div>
            `;
        }

        function showLoading() {
            const resultsPanel = document.getElementById('resultsPanel');
            resultsPanel.innerHTML = `
                <div class="loading">
                    <h3>Analyzing Your Portfolio...</h3>
                    <p>AI is processing latest news and market data for ${portfolio.length} stocks</p>
                    <div style="margin-top: 20px;">
                        <div style="display: inline-block; width: 40px; height: 40px; border: 3px solid rgba(0, 255, 150, 0.3); border-radius: 50%; border-top-color: #00ff96; animation: spin 1s ease-in-out infinite;"></div>
                    </div>
                </div>
                <style>
                    @keyframes spin {
                        to { transform: rotate(360deg); }
                    }
                </style>
            `;
        }

        function showError(message) {
            const resultsPanel = document.getElementById('resultsPanel');
            resultsPanel.innerHTML = `
                <div class="error-state">
                    <h3>Analysis Failed</h3>
                    <p>${message}</p>
                    <button onclick="analyzePortfolio()" style="margin-top: 16px; padding: 8px 16px; background: #ff6b6b; color: white; border: none; border-radius: 4px; cursor: pointer;">Try Again</button>
                </div>
            `;
        }

        async function analyzePortfolio() {
            if (portfolio.length === 0) return;

            showLoading();

            try {
                const response = await fetch('http://127.0.0.1:8003/dashboard/sentiment-analysis', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ stocks: portfolio })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                showAnalysisResults(data);
            } catch (error) {
                console.error('Error analyzing portfolio:', error);
                showError('Failed to analyze portfolio. Please check your connection and try again.');
            }
        }

        function showAnalysisResults(data) {
            const resultsPanel = document.getElementById('resultsPanel');

            // Calculate statistics from real data
            const stats = calculatePortfolioStats(data.stocks || []);

            resultsPanel.innerHTML = `
                <!-- Portfolio Summary -->
                <div class="analysis-section">
                    <div class="section-title">📊 Portfolio Summary</div>
                    <div class="portfolio-summary">
                        <p style="color: #c0c0c0; margin-bottom: 16px;">
                            ${data.portfolio_summary || 'Analysis completed for your selected stocks with real-time market data and sentiment scoring.'}
                        </p>
                        <div class="summary-grid">
                            <div class="summary-item">
                                <div class="summary-label">TOTAL STOCKS</div>
                                <div class="summary-value">${portfolio.length}</div>
                            </div>
                            <div class="summary-item">
                                <div class="summary-label">AVG SENTIMENT</div>
                                <div class="summary-value ${getOverallSentimentClass(data.stocks)}">${calculateAvgSentiment(data.stocks)}</div>
                            </div>
                            <div class="summary-item">
                                <div class="summary-label">RISK LEVEL</div>
                                <div class="summary-value neutral">${data.risk_level || 'Moderate'}</div>
                            </div>
                        </div>
                    </div>

                    <!-- Market Themes -->
                    ${data.themes ? `
                    <div class="themes-grid">
                        <div class="theme-card risks">
                            <div class="theme-title">⚠️ Portfolio Risks</div>
                            <ul class="theme-list">
                                ${(data.themes.risks || []).map(risk => `<li>${risk}</li>`).join('')}
                            </ul>
                        </div>
                        <div class="theme-card opportunities">
                            <div class="theme-title">🚀 Opportunities</div>
                            <ul class="theme-list">
                                ${(data.themes.opportunities || []).map(opp => `<li>${opp}</li>`).join('')}
                            </ul>
                        </div>
                        <div class="theme-card themes">
                            <div class="theme-title">📈 Market Themes</div>
                            <ul class="theme-list">
                                ${(data.themes.general || []).map(theme => `<li>${theme}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                    ` : ''}
                </div>

                <!-- Individual Stock Analysis -->
                <div class="analysis-section">
                    <div class="section-title">📋 Individual Stock Analysis</div>
                    ${(data.stocks || []).map(stock => `
                        <div class="stock-analysis">
                            <div class="stock-header">
                                <div class="stock-info">
                                    <div class="stock-ticker">📊 ${stock.symbol || stock.stock}</div>
                                </div>
                                <div class="stock-metrics">
                                    <div class="metric">
                                        <div class="metric-label">Sentiment</div>
                                        <div class="metric-value ${(stock.sentiment || 'neutral').toLowerCase()}">${stock.sentiment || 'NEUTRAL'}</div>
                                    </div>
                                    <div class="metric">
                                        <div class="metric-label">Category</div>
                                        <div class="metric-value">${stock.category || 'General'}</div>
                                    </div>
                                    <div class="metric">
                                        <div class="metric-label">Impact</div>
                                        <div class="metric-value ${(stock.price_impact || 'neutral').toLowerCase()}">${stock.price_impact || stock.impact || 'NEUTRAL'}</div>
                                    </div>
                                </div>
                            </div>
                            <div class="stock-summary">
                                <strong>Summary:</strong> ${stock.summary || stock.analysis || 'No detailed analysis available for this stock.'}
                            </div>
                        </div>
                    `).join('')}
                </div>

                <!-- Portfolio Statistics -->
                <div class="analysis-section">
                    <div class="section-title">📈 Portfolio Statistics</div>
                    <div class="stats-grid">
                        <div class="stat-section">
                            <div class="stat-title">Sentiment Distribution</div>
                            ${Object.entries(stats.sentiment).map(([key, value]) => `
                                <div class="stat-item">
                                    <span>${key.toUpperCase()}:</span>
                                    <span class="${key.toLowerCase()}">${value.count} stocks (${value.percentage}%)</span>
                                </div>
                            `).join('')}
                        </div>
                        <div class="stat-section">
                            <div class="stat-title">Price Impact Distribution</div>
                            ${Object.entries(stats.impact).map(([key, value]) => `
                                <div class="stat-item">
                                    <span>${key.toUpperCase()}:</span>
                                    <span class="${key.toLowerCase()}">${value.count} stocks (${value.percentage}%)</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div style="background: rgba(0, 255, 150, 0.1); padding: 16px; border-radius: 8px; margin-top: 20px; text-align: center;">
                        <span style="color: #00ff96; font-weight: 600;">✅ Portfolio analysis complete! Analyzed ${portfolio.length} stocks with real-time data.</span>
                    </div>

                    <div style="background: rgba(255, 215, 0, 0.1); padding: 12px; border-radius: 8px; margin-top: 16px; font-size: 14px; color: #ffd700;">
                        💡 <strong>Tip:</strong> Sentiment analysis is based on recent news and market data. Always do your own research before making investment decisions.
                    </div>
                </div>
            `;
        }

        function calculatePortfolioStats(stocks) {
            const sentimentCounts = {};
            const impactCounts = {};

            stocks.forEach(stock => {
                const sentiment = (stock.sentiment || 'neutral').toLowerCase();
                const impact = (stock.price_impact || stock.impact || 'neutral').toLowerCase();

                sentimentCounts[sentiment] = (sentimentCounts[sentiment] || 0) + 1;
                impactCounts[impact] = (impactCounts[impact] || 0) + 1;
            });

            const total = stocks.length || 1;

            const formatStats = (counts) => {
                const result = {};
                Object.entries(counts).forEach(([key, count]) => {
                    result[key] = {
                        count,
                        percentage: ((count / total) * 100).toFixed(1)
                    };
                });
                return result;
            };

            return {
                sentiment: formatStats(sentimentCounts),
                impact: formatStats(impactCounts)
            };
        }

        function calculateAvgSentiment(stocks) {
            if (!stocks || stocks.length === 0) return 'N/A';

            const sentimentValues = {
                'positive': 1,
                'strong positive': 2,
                'negative': -1,
                'strong negative': -2,
                'neutral': 0
            };

            const total = stocks.reduce((sum, stock) => {
                const sentiment = (stock.sentiment || 'neutral').toLowerCase();
                return sum + (sentimentValues[sentiment] || 0);
            }, 0);

            const avg = total / stocks.length;

            if (avg > 0.5) return '+' + (avg * 0.5).toFixed(1) + '%';
            if (avg < -0.5) return (avg * 0.5).toFixed(1) + '%';
            return '0.0%';
        }

        function getOverallSentimentClass(stocks) {
            if (!stocks || stocks.length === 0) return 'neutral';

            const positiveCount = stocks.filter(s =>
                (s.sentiment || '').toLowerCase().includes('positive')
            ).length;

            const negativeCount = stocks.filter(s =>
                (s.sentiment || '').toLowerCase().includes('negative')
            ).length;

            if (positiveCount > negativeCount) return 'positive';
            if (negativeCount > positiveCount) return 'negative';
            return 'neutral';
        }

        // Allow Enter key to add stock
        document.getElementById('stockInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addStock();
            }
        });

        // Initialize
        updatePortfolioDisplay();
        updateAnalyzeButton();
    </script>
</body>
</html>
