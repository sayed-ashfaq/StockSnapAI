<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Sentiment Analysis - TradePro AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        .header {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 150, 0.2);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            font-size: 24px;
            font-weight: 700;
            color: #00ff96;
            text-decoration: none;
        }

        .logo::before {
            content: "📊";
            margin-right: 10px;
            font-size: 28px;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00ff96 0%, #00cc77 100%);
            color: #000;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        /* Main Content */
        .main-content {
            padding: 40px 0;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 40px;
            min-height: calc(100vh - 100px);
        }

        /* Left Panel - Portfolio Input */
        .left-panel {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(0, 255, 150, 0.1);
            padding: 30px;
            height: fit-content;
            position: sticky;
            top: 120px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }

        .panel-header::before {
            content: "📈";
            font-size: 24px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-label {
            display: block;
            margin-bottom: 12px;
            font-weight: 600;
            color: #b0b0b0;
            font-size: 14px;
        }

        .stock-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .stock-input:focus {
            outline: none;
            border-color: #00ff96;
            background: rgba(255, 255, 255, 0.08);
        }

        .stock-input::placeholder {
            color: #666;
        }

        .add-stock-btn {
            width: 100%;
            padding: 12px;
            background: rgba(0, 255, 150, 0.1);
            border: 1px solid #00ff96;
            border-radius: 8px;
            color: #00ff96;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-stock-btn:hover {
            background: rgba(0, 255, 150, 0.2);
        }

        .portfolio-list {
            margin-bottom: 30px;
        }

        .portfolio-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid #00ff96;
        }

        .stock-symbol {
            font-weight: 700;
            color: #ffffff;
        }

        .remove-btn {
            background: rgba(255, 107, 107, 0.2);
            border: none;
            color: #ff6b6b;
            padding: 6px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .remove-btn:hover {
            background: rgba(255, 107, 107, 0.3);
        }

        .analyze-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00ff96 0%, #00cc77 100%);
            border: none;
            border-radius: 10px;
            color: #000;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .analyze-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 255, 150, 0.3);
        }

        .analyze-btn:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Right Panel - Analysis Results */
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .analysis-section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(0, 255, 150, 0.1);
            padding: 30px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Portfolio Summary */
        .portfolio-summary {
            background: linear-gradient(135deg, rgba(0, 255, 150, 0.1) 0%, rgba(255, 255, 255, 0.02) 100%);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .summary-item {
            text-align: center;
        }

        .summary-label {
            color: #b0b0b0;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .summary-value {
            font-size: 24px;
            font-weight: 700;
        }

        .positive { color: #00ff96; }
        .negative { color: #ff6b6b; }
        .neutral { color: #ffd700; }

        /* Market Themes */
        .themes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .theme-card {
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid;
        }

        .theme-card.risks {
            background: rgba(255, 107, 107, 0.1);
            border-left-color: #ff6b6b;
        }

        .theme-card.opportunities {
            background: rgba(0, 255, 150, 0.1);
            border-left-color: #00ff96;
        }

        .theme-card.themes {
            background: rgba(255, 215, 0, 0.1);
            border-left-color: #ffd700;
        }

        .theme-title {
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-list {
            list-style: none;
        }

        .theme-list li {
            padding: 4px 0;
            font-size: 14px;
            color: #c0c0c0;
        }

        .theme-list li::before {
            content: "•";
            margin-right: 8px;
            color: inherit;
        }

        /* Individual Stock Analysis */
        .stock-analysis {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .stock-analysis:hover {
            border-color: rgba(0, 255, 150, 0.3);
            background: rgba(255, 255, 255, 0.02);
        }

        .stock-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stock-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stock-ticker {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
        }

        .stock-metrics {
            display: flex;
            gap: 20px;
            margin-left: auto;
        }

        .metric {
            text-align: center;
        }

        .metric-label {
            font-size: 12px;
            color: #b0b0b0;
            margin-bottom: 2px;
        }

        .metric-value {
            font-weight: 700;
            font-size: 14px;
        }

        .stock-summary {
            color: #c0c0c0;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Portfolio Statistics */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .stat-section {
            background: rgba(255, 255, 255, 0.02);
            padding: 20px;
            border-radius: 12px;
        }

        .stat-title {
            font-weight: 700;
            margin-bottom: 16px;
            color: #ffffff;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #b0b0b0;
        }

        .loading::before {
            content: "⏳";
            display: block;
            font-size: 32px;
            margin-bottom: 16px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state::before {
            content: "📊";
            display: block;
            font-size: 48px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .left-panel {
                position: relative;
                top: 0;
            }
        }

        @media (max-width: 768px) {
            .themes-grid {
                grid-template-columns: 1fr;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .stock-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .stock-metrics {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="nav">
                <a href="/" class="logo">TradePro AI</a>
                <div class="nav-buttons">
                    <a href="/" class="btn btn-secondary">🏠 Dashboard</a>
                    <a href="/document-analysis" class="btn btn-primary">📄 Document Analysis</a>
                </div>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="main-content">
            <!-- Left Panel - Portfolio Input -->
            <div class="left-panel">
                <div class="panel-header">Stock News & Sentiment Analysis</div>
                <p style="color: #b0b0b0; margin-bottom: 24px; font-size: 14px;">
                    Enter stock symbols to get real-time news analysis with AI-powered sentiment scoring
                </p>

                <div class="input-section">
                    <label class="input-label">Your Stock Portfolio</label>
                    <input type="text" id="stockInput" class="stock-input"
                           placeholder="Enter Stock Symbol (e.g., AAPL, TSLA, NVDA/NYSE)"
                           maxlength="10">
                    <button class="add-stock-btn" onclick="addStock()">+ Add Stock</button>
                </div>

                <div class="portfolio-list">
                    <label class="input-label">Current Portfolio:</label>
                    <div id="portfolioList">
                        <!-- Portfolio items will be added here -->
                    </div>
                </div>

                <button class="analyze-btn" id="analyzeBtn" onclick="analyzePortfolio()" disabled>
                    🚀 Analyze Portfolio
                </button>
            </div>

            <!-- Right Panel - Analysis Results -->
            <div class="right-panel" id="resultsPanel">
                <div class="empty-state">
                    <h3>Ready for Analysis</h3>
                    <p>Add stocks to your portfolio and click "Analyze Portfolio" to get AI-powered sentiment analysis and market insights.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let portfolio = [];

        function addStock() {
            const input = document.getElementById('stockInput');
            const symbol = input.value.trim().toUpperCase();

            if (symbol && !portfolio.includes(symbol)) {
                portfolio.push(symbol);
                updatePortfolioDisplay();
                input.value = '';
            }

            updateAnalyzeButton();
        }

        function removeStock(symbol) {
            portfolio = portfolio.filter(stock => stock !== symbol);
            updatePortfolioDisplay();
            updateAnalyzeButton();

            if (portfolio.length === 0) {
                showEmptyState();
            }
        }

        function updatePortfolioDisplay() {
            const portfolioList = document.getElementById('portfolioList');

            if (portfolio.length === 0) {
                portfolioList.innerHTML = '<p style="color: #666; font-style: italic;">No stocks added yet</p>';
                return;
            }

            portfolioList.innerHTML = portfolio.map(symbol => `
                <div class="portfolio-item">
                    <span class="stock-symbol">${symbol}</span>
                    <button class="remove-btn" onclick="removeStock('${symbol}')">Remove</button>
                </div>
            `).join('');
        }

        function updateAnalyzeButton() {
            const analyzeBtn = document.getElementById('analyzeBtn');
            analyzeBtn.disabled = portfolio.length === 0;
        }

        function showEmptyState() {
            const resultsPanel = document.getElementById('resultsPanel');
            resultsPanel.innerHTML = `
                <div class="empty-state">
                    <h3>Ready for Analysis</h3>
                    <p>Add stocks to your portfolio and click "Analyze Portfolio" to get AI-powered sentiment analysis and market insights.</p>
                </div>
            `;
        }

        function showLoading() {
            const resultsPanel = document.getElementById('resultsPanel');
            resultsPanel.innerHTML = `
                <div class="loading">
                    <h3>Analyzing Your Portfolio...</h3>
                    <p>AI is processing latest news and market data for ${portfolio.length} stocks</p>
                </div>
            `;
        }

        function analyzePortfolio() {
            if (portfolio.length === 0) return;

            showLoading();

            // Simulate API call delay
            setTimeout(() => {
                showAnalysisResults();
            }, 3000);
        }

        function showAnalysisResults() {
            const resultsPanel = document.getElementById('resultsPanel');

            // Sample data - replace with actual API results
            const analysisData = {
                summary: {
                    totalStocks: portfolio.length,
                    avgSentiment: '+1.2%',
                    riskLevel: 'Moderate'
                },
                themes: {
                    risks: [
                        'Ongoing AI integration impacting tech stocks',
                        'Rising competition in electric vehicle market',
                        'Data security concerns affecting tech market trust'
                    ],
                    opportunities: [
                        'Expansion of AI capabilities promising growth potential',
                        'Increased EV adoption driving market demand for automotive stocks',
                        'Potential for strategic partnerships enhancing market positions'
                    ],
                    general: [
                        'Mixed sentiment across sectors',
                        'Market volatility due to economic uncertainty',
                        'Strong earnings reports from major companies'
                    ]
                },
                stocks: portfolio.map((symbol, index) => {
                    const sentiments = ['POSITIVE', 'NEGATIVE', 'NEUTRAL'];
                    const impacts = ['BULLISH', 'BEARISH', 'NEUTRAL'];
                    const categories = ['Technology', 'Automotive', 'Healthcare', 'Finance'];

                    const sentiment = sentiments[index % sentiments.length];
                    const impact = impacts[index % impacts.length];

                    return {
                        symbol,
                        sentiment,
                        impact,
                        category: categories[index % categories.length],
                        summary: getStockSummary(symbol, sentiment)
                    };
                })
            };

            resultsPanel.innerHTML = `
                <!-- Portfolio Summary -->
                <div class="analysis-section">
                    <div class="section-title">📊 Portfolio Summary</div>
                    <div class="portfolio-summary">
                        <p style="color: #c0c0c0; margin-bottom: 16px;">
                            Recent developments across the tech and automotive sectors indicate mixed sentiment. While some companies have shown resilience in market trends, concerns regarding data security and competitive pressures may hinder rapid growth. Overall, the tech giants remain dominant but are under scrutiny.
                        </p>
                        <div class="summary-grid">
                            <div class="summary-item">
                                <div class="summary-label">TOTAL STOCKS</div>
                                <div class="summary-value">${analysisData.summary.totalStocks}</div>
                            </div>
                            <div class="summary-item">
                                <div class="summary-label">AVG SENTIMENT</div>
                                <div class="summary-value positive">${analysisData.summary.avgSentiment}</div>
                            </div>
                            <div class="summary-item">
                                <div class="summary-label">RISK LEVEL</div>
                                <div class="summary-value neutral">${analysisData.summary.riskLevel}</div>
                            </div>
                        </div>
                    </div>

                    <!-- Market Themes -->
                    <div class="themes-grid">
                        <div class="theme-card risks">
                            <div class="theme-title">⚠️ Portfolio Risks</div>
                            <ul class="theme-list">
                                ${analysisData.themes.risks.map(risk => `<li>${risk}</li>`).join('')}
                            </ul>
                        </div>
                        <div class="theme-card opportunities">
                            <div class="theme-title">🚀 Opportunities</div>
                            <ul class="theme-list">
                                ${analysisData.themes.opportunities.map(opp => `<li>${opp}</li>`).join('')}
                            </ul>
                        </div>
                        <div class="theme-card themes">
                            <div class="theme-title">📈 Market Themes</div>
                            <ul class="theme-list">
                                ${analysisData.themes.general.map(theme => `<li>${theme}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- Individual Stock Analysis -->
                <div class="analysis-section">
                    <div class="section-title">📋 Individual Stock Analysis</div>
                    ${analysisData.stocks.map(stock => `
                        <div class="stock-analysis">
                            <div class="stock-header">
                                <div class="stock-info">
                                    <div class="stock-ticker">📊 ${stock.symbol}</div>
                                </div>
                                <div class="stock-metrics">
                                    <div class="metric">
                                        <div class="metric-label">Sentiment</div>
                                        <div class="metric-value ${stock.sentiment.toLowerCase()}">${stock.sentiment}</div>
                                    </div>
                                    <div class="metric">
                                        <div class="metric-label">Category</div>
                                        <div class="metric-value">${stock.category}</div>
                                    </div>
                                    <div class="metric">
                                        <div class="metric-label">Impact</div>
                                        <div class="metric-value ${stock.impact.toLowerCase()}">${stock.impact}</div>
                                    </div>
                                </div>
                            </div>
                            <div class="stock-summary">
                                <strong>Summary:</strong> ${stock.summary}
                            </div>
                        </div>
                    `).join('')}
                </div>

                <!-- Portfolio Statistics -->
                <div class="analysis-section">
                    <div class="section-title">📈 Portfolio Statistics</div>
                    <div class="stats-grid">
                        <div class="stat-section">
                            <div class="stat-title">Sentiment Distribution</div>
                            <div class="stat-item">
                                <span>NEGATIVE:</span>
                                <span class="negative">2 stocks (28.6%)</span>
                            </div>
                            <div class="stat-item">
                                <span>POSITIVE:</span>
                                <span class="positive">2 stocks (28.6%)</span>
                            </div>
                            <div class="stat-item">
                                <span>NEUTRAL:</span>
                                <span class="neutral">2 stocks (28.6%)</span>
                            </div>
                            <div class="stat-item">
                                <span>STRONG POSITIVE:</span>
                                <span class="positive">1 stocks (14.3%)</span>
                            </div>
                        </div>
                        <div class="stat-section">
                            <div class="stat-title">Price Impact Distribution</div>
                            <div class="stat-item">
                                <span>BULLISH:</span>
                                <span class="positive">3 stocks (42.9%)</span>
                            </div>
                            <div class="stat-item">
                                <span>BEARISH:</span>
                                <span class="negative">2 stocks (28.6%)</span>
                            </div>
                            <div class="stat-item">
                                <span>NEUTRAL:</span>
                                <span class="neutral">2 stocks (28.6%)</span>
                            </div>
                        </div>
                    </div>

                    <div style="background: rgba(0, 255, 150, 0.1); padding: 16px; border-radius: 8px; margin-top: 20px; text-align: center;">
                        <span style="color: #00ff96; font-weight: 600;">✅ Portfolio analysis complete! Analyzed ${portfolio.length} stocks in one go.</span>
                    </div>

                    <div style="background: rgba(255, 215, 0, 0.1); padding: 12px; border-radius: 8px; margin-top: 16px; font-size: 14px; color: #ffd700;">
                        💡 <strong>Tip:</strong> Sentiment analysis is based on recent news and market data. Always do your own research before making investment decisions.
                    </div>
                </div>
            `;
        }

        function getStockSummary(symbol, sentiment) {
            const summaries = {
                'POSITIVE': `${symbol} is positioned for growth with upcoming developments and strong market interest, indicating positive investor sentiment.`,
                'NEGATIVE': `${symbol} faces significant challenges that may affect investor confidence and future performance in the current market conditions.`,
                'NEUTRAL': `${symbol} shows steady momentum, maintaining a stable position as market conditions continue to evolve.`
            };

            return summaries[sentiment] || summaries['NEUTRAL'];
        }

        // Allow Enter key to add stock
        document.getElementById('stockInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addStock();
            }
        });

        // Initialize
        updatePortfolioDisplay();
        updateAnalyzeButton();
    </script>
</body>
</html>
